<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNG Runner Gold Edition</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; background: lightblue; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let score = 0;
        const maxScore = 5000;
        let gameState = 'MENU';

        // Game elements
        const player = { x: canvas.width / 2, y: canvas.height - 50, width: 30, height: 30 };
        const obstacles = [];
        const trophies = [];

        function createObstacle() {
            // Code to create obstacles
            obstacles.push({ x: Math.random() * canvas.width, y: 0 });
        }

        function drawPlayer() {
            ctx.fillStyle = 'lightblue';
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        function drawObstacles() {
            obstacles.forEach(obstacle => {
                ctx.fillStyle = 'gray'; // Fences or trash cans
                ctx.fillRect(obstacle.x, obstacle.y, 20, 20);
            });
        }

        function updateScore() {
            score = Math.min(score + 1, maxScore);
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawPlayer();
            drawObstacles();
            updateScore();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            gameState = 'PLAYING';
            gameLoop();
        }

        // Touch Controls
        canvas.addEventListener('touchstart', startGame);

        // Load High Score from localStorage
        const highScore = localStorage.getItem('highScore') || 0;

        // Initialization
        createObstacle();
    </script>
</body>
</html>
