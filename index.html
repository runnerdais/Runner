<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNG Runner</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { background: url('background.png'); }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let score = 0;
        let highScore = localStorage.getItem('highScore') || 0;
        const trophyImage = new Image();
        trophyImage.src = 'trophy.png';
        let gameState = 'MENU';

        function init() {
            addEventListeners();
            requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            clear();
            switch(gameState) {
                case 'MENU':
                    showMenu();
                    break;
                case 'PLAYING':
                    updateGame();
                    break;
                case 'WIN':
                    showWin();
                    break;
                case 'GAMEOVER':
                    showGameOver();
                    break;
            }
            requestAnimationFrame(gameLoop);
        }

        function clear() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function showMenu() {
            ctx.fillText('Press Start to Play', canvas.width / 2, canvas.height / 2);
            ctx.fillText('High Score: ' + highScore, canvas.width / 2, canvas.height / 2 + 30);
        }

        function updateGame() {
            // Game update logic, including drawing player, obstacles, etc.
            // Update score logic
            if (score >= 5000) {
                gameState = 'WIN';
            }
        }

        function showWin() {
            ctx.drawImage(trophyImage, canvas.width / 2 - 25, canvas.height / 2 - 25);
            ctx.fillText('You Win!', canvas.width / 2, canvas.height / 2);
            saveHighScore();
        }

        function showGameOver() {
            ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2);
            ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 + 30);
        }

        function saveHighScore() {
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('highScore', highScore);
            }
        }

        function addEventListeners() {
            canvas.addEventListener('touchstart', startTouch);
            canvas.addEventListener('touchend', endTouch);
        }

        function startTouch(e) {
            if (gameState === 'MENU') {
                gameState = 'PLAYING';
            }
        }

        function endTouch(e) {
            // Logic for what happens when touch ends
        }

        init();
    </script>
</body>
</html>
